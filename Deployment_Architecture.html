<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail AI Assistant - Deployment Architecture</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        svg {
            width: 100%;
            height: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
        }

</head>
<body>
    <div class="container">

  <defs>
    <style>
      :root {
        --primary: #3b82f6;
        --secondary: #10b981;
        --accent: #f59e0b;
        --danger: #ef4444;
        --purple: #8b5cf6;
        --neutral: #6b7280;
        --light: #f3f4f6;
        --border: #d1d5db;
      }
      .box { fill: white; stroke: var(--border); stroke-width: 2; rx: 4; }
      .box-primary { fill: var(--primary); }
      .box-secondary { fill: var(--secondary); }
      .box-accent { fill: var(--accent); }
      .box-danger { fill: var(--danger); }
      .box-purple { fill: var(--purple); }
      .title { font-weight: bold; font-size: 12px; }
      .label { font-size: 10px; fill: var(--neutral); }
      .text-light { fill: white; }
      .arrow { stroke: var(--primary); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-ci { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 4,4; marker-end: url(#arrowhead-ci); }
      .layer-title { font-size: 14px; font-weight: bold; fill: var(--primary); }
      .section-title { font-size: 13px; font-weight: bold; fill: var(--secondary); }
      .container-box { fill: none; stroke: var(--secondary); stroke-width: 2; stroke-dasharray: 5,5; rx: 4; }
      .divider { stroke: var(--border); stroke-width: 1; }

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">

    </marker>
    <marker id="arrowhead-ci" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="600" y="30" class="layer-title" text-anchor="middle" font-size="18">Retail AI Assistant - Deployment Architecture</text>

  <rect x="165" y="135" width="85" height="35" class="box box-secondary"/>
  <text x="207.5" y="150" class="title text-light" text-anchor="middle">Streamlit</text>

  <text x="150" y="195" class="label" text-anchor="middle">./vectorstore/</text>

  <text x="140" y="350" class="label" text-anchor="middle">Cloud Run / App Engine</text>
