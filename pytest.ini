[pytest]
# PyTest Configuration for Retail AI Assistant

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    async: Asynchronous tests
    slow: Slow running tests

# Minimum Python version
minversion = 6.0

# Coverage options
[coverage:run]
source = agent,config,api,vectorstore

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
